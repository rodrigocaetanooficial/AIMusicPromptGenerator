name: Deploy ai-music.viaweb.pro

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ai-music
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build (standalone)
        run: |
          npx prisma generate
          rm -rf .next
          npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./dev.db"
          NEXT_PUBLIC_GA_ID: "G-XYR5JY1Z3N"

      - name: Pack standalone release
        run: |
          set -euo pipefail
          # Next standalone output
          test -d .next/standalone
          mkdir -p release
          # Copy standalone server
          cp -a .next/standalone/. release/
          # Static assets required next to standalone
          mkdir -p release/.next
          cp -a .next/static release/.next/static
          if [ -d public ]; then
            cp -a public release/public
          fi
          # Bundle the Prisma CLI so deploy.sh can run db push on the VPS
          # (the standalone output omits it — without this, schema changes
          # silently never reach the production SQLite database).
          PRISMA_VERSION=$(node -p "require('./package.json').dependencies.prisma")
          mkdir -p release/prisma-cli
          cp prisma/schema.prisma release/prisma-cli/schema.prisma
          (cd release/prisma-cli && npm init -y >/dev/null 2>&1 && npm install "prisma@$PRISMA_VERSION" --no-audit --no-fund --loglevel=error)
          # Ensure server.js exists
          test -f release/server.js
          tar -C release -czf ai-music-release.tgz .
          ls -lh ai-music-release.tgz

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ai-music-release.tgz"
          target: "/tmp"
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            STAGING=/tmp/ai-music-staging-$$
            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            tar -xzf /tmp/ai-music-release.tgz -C "$STAGING"
            /opt/ai-music/deploy.sh "$STAGING"
            rm -rf "$STAGING" /tmp/ai-music-release.tgz
            # smoke test: origin with retry (standalone app takes a moment to bind after restart)
            ok=0
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3020/ || true)
              echo "origin_http=$code (attempt $i)"
              case "$code" in 200|301|302|307|308) ok=1; break;; esac
              sleep 3
            done
            test "$ok" = "1" || { echo "ORIGIN CHECK FAILED"; exit 1; }
            # public check: informational — Cloudflare may 403 GitHub runner IPs (Bot Fight Mode)
            pub=$(curl -sk -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" https://ai-music.viaweb.pro/ || true)
            echo "public_http=$pub"
            case "$pub" in
              200|301|302|307|308) ;;
              *) echo "warn: public check returned $pub — likely Cloudflare blocking runner IP; origin verified OK" ;;
            esac
